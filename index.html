<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Deck</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root{
    --ink:#14181F; --ink-2:#0F1319; --panel:#1C222C; --panel-2:#232A36;
    --paper:#EDE6D6; --paper-2:#E3DAC4; --brass:#B8874A; --brass-light:#D9AE74;
    --slate:#8B93A1; --slate-dim:#5C6472; --signal:#6FA98A; --danger:#C1666B;
    --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; font-family:var(--sans); background:var(--ink); color:var(--paper); -webkit-font-smoothing:antialiased; }
  #app{height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}
  ::selection{background:var(--brass); color:var(--ink);}
  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--panel-2); border-radius:6px;}

  .center-wrap{ flex:1; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at 50% 30%, rgba(184,135,74,0.08), transparent 60%), var(--ink); }
  .center-card{ display:flex; flex-direction:column; align-items:center; gap:22px; padding:20px; width:340px; max-width:90vw; }
  .dial{ width:150px; height:150px; }
  .dial-tick{ stroke:var(--slate-dim); stroke-width:2; }
  .dial-tick.major{ stroke:var(--brass); stroke-width:3; }
  .dial-ring{ fill:none; stroke:var(--panel-2); stroke-width:1.5; }
  .dial-needle{ stroke:var(--brass-light); stroke-width:3; stroke-linecap:round; transform-origin:75px 75px; transition:transform .6s cubic-bezier(.2,.8,.2,1);}
  .dial-center{ fill:var(--brass); }
  .lock-title{ font-family:var(--serif); font-size:22px; letter-spacing:.04em; color:var(--paper); margin:0; }
  .lock-sub{ color:var(--slate); font-size:13px; margin:0; text-align:center; line-height:1.6; }
  .passcode-input{
    width:100%; background:var(--panel); border:1px solid var(--panel-2); color:var(--brass-light);
    padding:14px 16px; border-radius:9px; font-size:18px; letter-spacing:.05em; outline:none; text-align:center;
    font-family:var(--serif);
  }
  .passcode-input:focus{ border-color:var(--brass); }
  .enter-btn{ width:100%; background:var(--brass); color:var(--ink); border:none; font-weight:600;
    padding:13px; border-radius:9px; font-size:14px; transition:box-shadow .2s, filter .2s, transform .2s; }
  .enter-btn:hover{ background:var(--brass-light); box-shadow:0 0 20px rgba(184,135,74,0.6); filter:brightness(1.1); transform:scale(1.03); }
  .enter-btn:disabled{ opacity:.5; }
  .lock-error{ color:var(--danger); font-size:13px; min-height:16px; text-align:center; }
  .lock-success{ color:var(--signal); font-size:13px; min-height:16px; text-align:center; }
  .lock-hint{ color:var(--slate-dim); font-size:11.5px; text-align:center; line-height:1.5; }
  .spinner{ width:34px; height:34px; border-radius:50%; border:3px solid var(--panel-2); border-top-color:var(--brass); animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:18px 28px;
    border-bottom:1px solid var(--panel-2); background:var(--ink-2); }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-name{ font-family:var(--serif); font-size:18px; letter-spacing:.03em; }
  .sync-pill{ font-size:11px; color:var(--slate); display:flex; align-items:center; gap:6px; }
  .sync-dot{ width:7px; height:7px; border-radius:50%; background:var(--signal); }
  .sync-dot.saving{ background:var(--brass); }
  .sync-dot.error{ background:var(--danger); }
  .icon-btn{ background:transparent; border:1px solid var(--panel-2); color:var(--slate);
    width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    transition:border-color .18s ease, color .18s ease, box-shadow .18s ease, transform .18s ease; }
  .icon-btn:hover{ border-color:var(--brass); color:var(--brass-light); box-shadow:0 0 0 3px rgba(184,135,74,0.12); transform:scale(1.04); }
  .topbar-actions{ display:flex; gap:8px; align-items:center; }

  .workspace{ flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .ws-body-split{ flex:1; display:flex; overflow:hidden; }
  .thread-col{ width:260px; flex-shrink:0; border-right:1px solid var(--panel-2); background:var(--ink-2); display:flex; flex-direction:column; overflow-y:auto; padding:14px 14px 6px; }
  .new-thread-btn{ width:100%; display:block; background:var(--panel); border:1px dashed var(--panel-2); color:var(--slate);
    padding:9px; border-radius:999px; font-size:12.5px; text-align:center; margin-bottom:10px;
    transition:border-color .18s ease, color .18s ease, transform .18s ease; }
  .new-thread-btn:hover{ border-color:var(--brass); color:var(--brass-light); transform:scale(1.02); }
  .thread-list{ display:flex; flex-direction:column; gap:6px; padding-bottom:8px; }
  .thread-row{ display:flex; align-items:center; gap:8px; padding:10px 10px 10px 12px; border-radius:4px 8px 8px 4px;
    background:var(--panel); border-left:4px solid var(--brass); cursor:pointer; position:relative; transition:.15s; }
  .thread-row:hover{ background:var(--panel-2); }
  .thread-row.active{ background:var(--panel-2); }
  .thread-row.active .thread-row-name{ color:var(--brass-light); }
  .thread-row-name{ flex:1; font-size:13px; color:var(--paper); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .thread-edit-btn{ background:transparent; border:none; color:var(--slate-dim); width:22px; height:22px; border-radius:5px;
    display:flex; align-items:center; justify-content:center; opacity:0; transition:.15s; flex-shrink:0; }
  .thread-row:hover .thread-edit-btn{ opacity:1; }
  .thread-edit-btn:hover{ background:var(--panel-2); color:var(--brass-light); }
  .thread-empty{ color:var(--slate-dim); font-size:12px; padding:6px 4px 14px; text-align:center; line-height:1.5; }
  .workspace-placeholder{ flex:1; display:flex; align-items:center; justify-content:center; color:var(--slate-dim); font-size:14px; padding:40px; text-align:center; }

  .msg.assistant .md-content p{ margin:0 0 10px; }
  .msg.assistant .md-content p:last-child{ margin-bottom:0; }
  .msg.assistant .md-content ul, .msg.assistant .md-content ol{ margin:6px 0 10px; padding-left:20px; }
  .msg.assistant .md-content li{ margin:4px 0; }
  .msg.assistant .md-content strong{ font-weight:700; color:var(--brass-light); }
  .msg.assistant .md-content em{ font-style:italic; }
  .msg.assistant .md-content a{ color:var(--brass-light); }
  .msg.assistant .md-content h1, .msg.assistant .md-content h2, .msg.assistant .md-content h3{ margin:12px 0 6px; font-family:var(--serif); font-size:1.08em; }
  .msg.assistant .md-content h1:first-child, .msg.assistant .md-content h2:first-child, .msg.assistant .md-content h3:first-child{ margin-top:0; }
  .msg.assistant .md-content blockquote{ margin:8px 0; padding-left:12px; border-left:3px solid var(--brass); color:var(--slate); }
  .msg.assistant .md-content code{
    font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:0.88em;
    background:var(--panel-2); padding:2px 6px; border-radius:4px; }
  .msg.assistant .md-content pre{
    background:var(--panel-2); border:1px solid var(--slate-dim); border-radius:8px; padding:12px 14px;
    overflow-x:auto; margin:8px 0; }
  .msg.assistant .md-content pre code{ background:none; padding:0; }

  .chat-pane{ flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .chat-empty-wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding:24px; overflow:auto; }
  .chat-empty-inner{ width:100%; max-width:640px; display:flex; flex-direction:column; gap:18px; }
  .chat-empty-heading{ font-family:var(--serif); font-size:26px; text-align:center; margin:0; color:var(--paper); }
  .chat-messages{ flex:1; overflow-y:auto; padding:26px 26px 10px; display:flex; flex-direction:column; gap:18px; }
  .msg{ max-width:72%; padding:13px 18px; border-radius:12px; font-size:14px; line-height:1.55; }
  .msg.user{ align-self:flex-end; background:var(--brass); color:var(--ink); border-bottom-right-radius:3px; }
  .msg.assistant{ align-self:flex-start; background:var(--panel); border:1px solid var(--panel-2); border-bottom-left-radius:3px; }
  .msg.system-note{ align-self:center; color:var(--slate-dim); font-size:12px; background:none; }
  .msg-img{ max-width:220px; border-radius:8px; display:block; margin-top:8px; }
  .msg-file{ font-size:12px; color:var(--slate-dim); margin-top:6px; }
  @keyframes msgIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
  .msg.msg-in{ animation:msgIn 220ms ease-out; }
  .typing{ align-self:flex-start; display:flex; align-items:center; gap:5px; padding:12px 16px; }
  .typing-dot{ width:7px; height:7px; border-radius:50%; background:var(--brass-light); opacity:.5; animation:typingBounce 1.1s ease-in-out infinite; }
  .typing-dot:nth-child(2){ animation-delay:.15s; }
  .typing-dot:nth-child(3){ animation-delay:.3s; }
  @keyframes typingBounce{ 0%,60%,100%{ transform:translateY(0); opacity:.5; } 30%{ transform:translateY(-4px); opacity:1; } }
  .chat-input-row{ display:flex; align-items:flex-end; gap:10px; padding:16px 22px 22px; border-top:1px solid var(--panel-2); background:var(--ink-2); }
  .chat-input-row.pill{ border:1px solid var(--panel-2); border-radius:999px; background:var(--panel); padding:8px 8px 8px 20px; }
  .chat-input-row.pill .chat-textarea{ background:transparent; border:none; }
  .chat-input-row.pill .chat-textarea:focus{ box-shadow:none; }
  .attach-btn{ background:var(--panel); border:1px solid var(--panel-2); color:var(--slate); width:42px; height:42px; border-radius:8px; flex-shrink:0;
    transition:border-color .18s ease, color .18s ease, transform .18s ease; }
  .attach-btn:hover{ border-color:var(--brass); color:var(--brass-light); transform:scale(1.04); }
  .capture-note{ position:absolute; bottom:48px; left:0; background:var(--panel-2); color:var(--slate); font-size:11px; padding:6px 10px; border-radius:6px; white-space:nowrap; box-shadow:0 4px 14px rgba(0,0,0,0.3); z-index:5; }
  .chat-textarea{ flex:1; background:var(--panel); border:1px solid var(--panel-2); color:var(--paper); border-radius:10px; padding:12px 14px; font-size:14px; resize:none; outline:none; max-height:140px; min-height:42px;
    transition:border-color .18s ease, box-shadow .18s ease; }
  .chat-textarea:focus{ border-color:var(--brass); box-shadow:0 0 0 3px rgba(184,135,74,0.15); }
  .send-btn{ background:var(--brass); color:var(--ink); border:none; font-weight:600; width:42px; height:42px; border-radius:8px; flex-shrink:0;
    box-shadow:0 2px 12px rgba(184,135,74,0.25); transition:box-shadow .18s ease, transform .18s ease, filter .18s ease; }
  .send-btn:hover:not(:disabled){ box-shadow:0 4px 20px rgba(184,135,74,0.45); transform:scale(1.05); filter:brightness(1.05); }
  .send-btn:disabled{ opacity:.4; box-shadow:none; }
  .attachment-preview{ display:flex; gap:8px; padding:0 22px; flex-wrap:wrap; }
  .attach-chip{ background:var(--panel-2); color:var(--slate); font-size:11.5px; padding:6px 10px; border-radius:6px; display:flex; align-items:center; gap:6px; }
  .attach-chip button{ background:none; border:none; color:var(--danger); font-size:13px; padding:0; }

  @keyframes backdropIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes backdropOut{ from{ opacity:1; } to{ opacity:0; } }
  @keyframes modalIn{ from{ opacity:0; transform:scale(.96) translateY(6px); } to{ opacity:1; transform:scale(1) translateY(0); } }
  @keyframes modalOut{ from{ opacity:1; transform:scale(1) translateY(0); } to{ opacity:0; transform:scale(.96) translateY(6px); } }
  .modal-backdrop{ position:fixed; inset:0; background:rgba(10,12,16,0.7); display:flex; align-items:center; justify-content:center; z-index:50;
    animation:backdropIn 180ms ease-out; }
  .modal-backdrop.closing{ animation:backdropOut 160ms ease-in forwards; }
  .modal{ background:var(--panel); border:1px solid var(--panel-2); border-radius:12px; width:420px; max-width:90vw; padding:28px; display:flex; flex-direction:column; gap:16px; box-shadow:0 20px 60px rgba(0,0,0,0.5); position:relative;
    animation:modalIn 220ms cubic-bezier(.2,.8,.2,1); }
  .modal-backdrop.closing .modal{ animation:modalOut 160ms ease-in forwards; }
  .modal-title{ font-family:var(--serif); font-size:19px; margin:0; }
  .modal-sub{ color:var(--slate); font-size:12.5px; margin:-10px 0 4px; line-height:1.5; }
  .field-label{ font-size:12px; color:var(--slate); margin-bottom:6px; display:block; }
  .field-input{ width:100%; background:var(--ink); border:1px solid var(--panel-2); color:var(--paper); padding:10px 12px; border-radius:7px; font-size:13.5px; outline:none;
    transition:border-color .18s ease, box-shadow .18s ease; }
  .field-input:focus{ border-color:var(--brass); box-shadow:0 0 0 3px rgba(184,135,74,0.15); }
  .field-group{ display:flex; flex-direction:column; }
  .color-swatches{ display:flex; gap:10px; flex-wrap:wrap; margin-top:2px; }
  .color-swatch{ width:28px; height:28px; border-radius:50%; border:2px solid transparent; padding:0; cursor:pointer; transition:.18s; }
  .color-swatch:hover{ transform:scale(1.1); }
  .color-swatch.selected{ border-color:var(--paper); box-shadow:0 0 0 2px var(--panel); }
  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .modal-btn{ flex:1; padding:11px; border-radius:8px; border:none; font-size:13.5px; font-weight:600;
    transition:background .18s ease, filter .18s ease, transform .18s ease; }
  .modal-btn.cancel{ background:var(--panel-2); color:var(--slate); }
  .modal-btn.cancel:hover{ background:var(--slate-dim); color:var(--paper); }
  .modal-btn.save{ background:var(--brass); color:var(--ink); }
  .modal-btn.save:hover{ filter:brightness(1.08); transform:scale(1.02); }
  .modal-btn.danger{ background:var(--danger); color:var(--ink); }
  .modal-btn.danger:hover{ filter:brightness(1.08); transform:scale(1.02); }
  .modal-danger-row{ display:flex; justify-content:flex-start; }
  .delete-btn{ background:transparent; border:1px solid var(--danger); color:var(--danger);
    padding:8px 14px; border-radius:7px; font-size:12.5px; font-weight:600;
    transition:background .18s ease, color .18s ease, transform .18s ease; }
  .delete-btn:hover{ background:var(--danger); color:var(--ink); transform:scale(1.02); }
  .close-x{ position:absolute; top:16px; right:16px; background:none; border:none; color:var(--slate); font-size:18px; transition:color .18s ease, transform .18s ease; }
  .close-x:hover{ color:var(--brass-light); transform:scale(1.1); }
  .provider-presets{ display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
  .preset-chip{ background:var(--ink); border:1px solid var(--panel-2); color:var(--slate); font-size:11px; padding:5px 10px; border-radius:20px;
    transition:border-color .18s ease, color .18s ease, transform .18s ease; }
  .preset-chip:hover{ border-color:var(--brass); color:var(--brass-light); transform:scale(1.03); }
  .config-warning{ background:rgba(193,102,107,0.12); border:1px solid var(--danger); color:#F0C9CB; font-size:12.5px; padding:14px 16px; border-radius:8px; line-height:1.6; max-width:420px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  const REQUIRED_PASSCODE = "apple429strange";

  /* =====================================================================
     CLOUD CONFIG — replace this with YOUR Supabase project's URL + anon key.
     Get it from: Supabase dashboard → your project → Project Settings → API.
     The anon key is safe to expose in client code — it's meant to be public;
     Row Level Security policies on the table control what it can actually do.
     ===================================================================== */
  const SUPABASE_URL = "https://apmzrwyedvyciycudbol.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_vEOOipg2qgiCoTT326Uo2g_foRwH6GD";

  let db = null;
  let cloudConfigured = false;
  try{
    if(SUPABASE_URL !== "REPLACE_ME" && SUPABASE_ANON_KEY !== "REPLACE_ME"){
      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      cloudConfigured = true;
    }
  }catch(e){ console.error("Supabase init failed", e); cloudConfigured = false; }

  /* ===================== STATE ===================== */
  const DEFAULT_CHAT_COLOR = "#B8874A";
  const CHAT_COLORS = [
    "#B8874A", // brass
    "#D9AE74", // brass-light
    "#6FA98A", // signal (muted green)
    "#C1666B", // danger (muted red)
    "#8B93A1", // slate (muted blue-gray)
    "#8E7CC3", // muted violet
    "#5C8AA8", // muted teal-blue
    "#B2653B"  // muted terracotta
  ];

  function defaultState(){
    return {
      chats: [],
      settings: { apiBase:"", apiKey:"", model:"" }
    };
  }

  function newChatId(){
    return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  // Runs once per load — flattens the old classes → threads hierarchy into one flat `chats`
  // array (dropping notes/type; a thread's id/name/color/chat carry over as-is). Idempotent:
  // skips straight through once `state.chats` already exists as an array.
  function migrateState(s){
    if(Array.isArray(s.chats)) return s;
    s.chats = [];
    (s.classes || []).forEach(c=>{
      // Threads is the expected shape here, but fall back to the even-older per-class
      // assignments/chat fields too, in case this state predates that migration ever running.
      let threads = Array.isArray(c.threads) ? c.threads : [];
      if(!Array.isArray(c.threads)){
        if(Array.isArray(c.assignments)) threads = threads.concat(c.assignments);
        if(Array.isArray(c.chat) && c.chat.length) threads.push({ id:newChatId(), name:"General chat", color:DEFAULT_CHAT_COLOR, chat:c.chat });
      }
      threads.forEach(t=>{
        s.chats.push({ id:t.id, name:t.name, color: t.color || DEFAULT_CHAT_COLOR, chat: Array.isArray(t.chat) ? t.chat : [] });
      });
    });
    delete s.classes;
    return s;
  }

  let state = null;
  let currentHash = null;
  let saveTimer = null;
  let syncStatus = "idle"; // idle | saving | synced | error

  async function sha256Hex(str){
    const enc = new TextEncoder().encode(str);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }

  function queueSave(){
    if(!currentHash) return;
    syncStatus = "saving"; updateSyncPill();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{
      try{
        const { error } = await db.from("study_deck").upsert({ id: currentHash, data: state, updated_at: new Date().toISOString() });
        if(error) throw error;
        syncStatus = "synced";
      }catch(err){
        console.error("cloud save failed", err);
        syncStatus = "error";
      }
      updateSyncPill();
    }, 600);
  }
  function updateSyncPill(){
    const dot = document.querySelector(".sync-dot");
    const label = document.querySelector(".sync-label");
    if(!dot) return;
    dot.className = "sync-dot" + (syncStatus==="saving" ? " saving" : syncStatus==="error" ? " error" : "");
    if(label) label.textContent = syncStatus==="saving" ? "Saving…" : syncStatus==="error" ? "Save failed — retrying" : "Synced";
  }

  /* ===================== APP NAV STATE ===================== */
  let view = "entry"; // entry | loading | main
  let entryValue = "";
  let entryError = "";
  let entrySuccess = "";
  let entryBusy = false;
  let activeChatId = null;
  let settingsOpen = false;
  let editingEntity = null; // { obj } — the chat being renamed/recolored/deleted
  let confirmingDeleteChat = false;
  let sending = false;
  let pendingAttachments = [];
  let captureNote = "";

  const root = document.getElementById("app");

  function el(tag, attrs, ...children){
    const e = document.createElement(tag);
    if(attrs) for(const k in attrs){
      if(k === "class") e.className = attrs[k];
      else if(k.startsWith("on") && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
      else if(k === "html") e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    children.flat().forEach(c=>{
      if(c === null || c === undefined) return;
      if(typeof c === "string" || typeof c === "number") e.appendChild(document.createTextNode(c));
      else e.appendChild(c);
    });
    return e;
  }

  function getChat(id){ return state.chats.find(t=>t.id===id); }
  function apiConfigured(){ return !!(state.settings.apiBase && state.settings.apiKey && state.settings.model); }

  function renderMarkdownHtml(text){
    const raw = (typeof marked !== "undefined") ? marked.parse(text || "") : String(text || "");
    return (typeof DOMPurify !== "undefined") ? DOMPurify.sanitize(raw) : raw;
  }

  function animateModalClose(backdrop, after){
    backdrop.classList.add("closing");
    setTimeout(after, 160);
  }

  const GENERIC_SYSTEM_PROMPT = "You are a helpful, encouraging AI assistant. Help the student with whatever they're working on — answering questions, explaining concepts, reviewing writing, reading screenshots/files they send. Be concise and direct.";

  /* ===================== AI API CALL ===================== */
  async function callAssistant(systemPrompt, messages){
    if(!apiConfigured()) throw new Error("NO_CONFIG");
    const body = { model: state.settings.model, messages: [{ role:"system", content: systemPrompt }, ...messages], max_tokens: 1000 };
    const res = await fetch(state.settings.apiBase.replace(/\/$/,"") + "/chat/completions", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization": "Bearer " + state.settings.apiKey },
      body: JSON.stringify(body)
    });
    if(!res.ok){ const t = await res.text().catch(()=> ""); throw new Error("API error " + res.status + " " + t.slice(0,200)); }
    const data = await res.json();
    const choice = data.choices && data.choices[0];
    const content = choice && choice.message && choice.message.content;
    if(!content) throw new Error("Empty response from API");
    return content;
  }

  function dialSvg(angle){
    const ticks = [];
    for(let i=0;i<24;i++){
      const a = (i/24) * 2*Math.PI;
      const major = i % 6 === 0;
      const r1 = major ? 56 : 61, r2 = 68;
      const x1 = 75 + r1*Math.sin(a), y1 = 75 - r1*Math.cos(a);
      const x2 = 75 + r2*Math.sin(a), y2 = 75 - r2*Math.cos(a);
      ticks.push(`<line class="dial-tick${major?' major':''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" />`);
    }
    return `<svg class="dial" viewBox="0 0 150 150">
      <circle class="dial-ring" cx="75" cy="75" r="68" />
      ${ticks.join("")}
      <g class="dial-needle" style="transform:rotate(${angle}deg)"><line x1="75" y1="75" x2="75" y2="26" /></g>
      <circle class="dial-center" cx="75" cy="75" r="5" />
    </svg>`;
  }

  async function submitEntry(){
    if(entryValue.trim().length < 4) return;

    /* ===== TEMP DEBUG — remove once passcode mismatch is diagnosed ===== */
    (function(){
      const typed = entryValue.trim();
      const expected = REQUIRED_PASSCODE;
      console.log("[passcode-debug] typed:", JSON.stringify(typed), "length:", typed.length);
      console.log("[passcode-debug] expected:", JSON.stringify(expected), "length:", expected.length);
      console.log("[passcode-debug] typed === expected:", typed === expected);
      const maxLen = Math.max(typed.length, expected.length);
      const rows = [];
      for(let i=0;i<maxLen;i++){
        const tc = typed[i];
        const ec = expected[i];
        rows.push({
          index: i,
          typedChar: tc, typedCode: tc !== undefined ? tc.charCodeAt(0) : null,
          expectedChar: ec, expectedCode: ec !== undefined ? ec.charCodeAt(0) : null,
          match: tc === ec
        });
      }
      console.table(rows);
    })();
    /* ===== END TEMP DEBUG ===== */

    if(entryValue.trim() !== REQUIRED_PASSCODE){
      entryError = "Wrong password";
      entrySuccess = "";
      render();
      return;
    }
    entryError = "";
    entrySuccess = "Correct! Welcome in";
    entryBusy = true;
    render();
    await new Promise(resolve => setTimeout(resolve, 1000));
    entrySuccess = "";
    entryBusy = false;
    view = "loading"; render();
    try{
      const hash = await sha256Hex(entryValue.trim());
      const { data: row, error: selErr } = await db.from("study_deck").select("data").eq("id", hash).maybeSingle();
      if(selErr) throw selErr;
      if(row){
        state = row.data;
      } else {
        state = defaultState();
        const { error: insErr } = await db.from("study_deck").insert({ id: hash, data: state });
        if(insErr) throw insErr;
      }
      state = migrateState(state);
      currentHash = hash;
      entryValue = "";
      syncStatus = "synced";
      view = "main";
    }catch(err){
      console.error(err);
      entryError = "Couldn't reach the cloud — check your connection and try again.";
      view = "entry";
    }
    render();
  }

  async function captureFrameFromStream(stream){
    const video = document.createElement("video");
    video.style.position = "fixed";
    video.style.left = "-9999px";
    video.muted = true;
    video.srcObject = stream;
    document.body.appendChild(video);
    try{
      await new Promise((resolve, reject)=>{
        video.onloadedmetadata = ()=> video.play().then(resolve).catch(reject);
      });
      await new Promise(r=>requestAnimationFrame(r));
      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/png");
    } finally {
      video.remove();
    }
  }

  async function captureScreen(){
    captureNote = "";
    if(!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia){
      captureNote = "Screen capture isn't supported in this browser.";
      render();
      setTimeout(()=>{ captureNote=""; render(); }, 3000);
      return;
    }
    let stream = null;
    try{
      stream = await navigator.mediaDevices.getDisplayMedia({ video:true });
      const dataUrl = await captureFrameFromStream(stream);
      pendingAttachments.push({ type:"image", name:"screen-capture.png", dataUrl });
      render();
    } catch(err){
      console.error("screen capture cancelled or failed", err);
      captureNote = "Screen capture cancelled or unavailable.";
      render();
      setTimeout(()=>{ captureNote=""; render(); }, 3000);
    } finally {
      if(stream) stream.getTracks().forEach(t=>t.stop());
    }
  }

  function handleFiles(fileList, cb){
    Array.from(fileList).forEach(file=>{
      if(file.type.startsWith("image/")){
        const reader = new FileReader();
        reader.onload = ()=>{ pendingAttachments.push({type:"image", name:file.name, dataUrl:reader.result}); cb(); };
        reader.readAsDataURL(file);
      } else {
        const reader = new FileReader();
        reader.onload = ()=>{ pendingAttachments.push({type:"text", name:file.name, text:reader.result}); cb(); };
        reader.readAsText(file);
      }
    });
  }

  async function sendChat(obj, textarea, systemPrompt){
    const text = textarea.value.trim();
    if(!text && pendingAttachments.length === 0) return;
    if(!apiConfigured()){ settingsOpen = true; render(); return; }

    let fullText = text;
    let imageForBubble = null;
    let fileNameForBubble = null;
    const contentParts = [];

    pendingAttachments.forEach(a=>{
      if(a.type === "text"){ fullText += (fullText ? "\n\n" : "") + `[Attached file: ${a.name}]\n${a.text}`; fileNameForBubble = a.name; }
    });
    if(text || pendingAttachments.some(a=>a.type==="text")) contentParts.push({ type:"text", text: fullText || "(see attached file)" });
    pendingAttachments.forEach(a=>{ if(a.type === "image"){ contentParts.push({ type:"image_url", image_url:{ url: a.dataUrl } }); imageForBubble = a.dataUrl; } });

    const userMsgContent = contentParts.length > 1 ? contentParts : (fullText || "(image attached)");
    obj.chat.push({ role:"user", content: text || (fileNameForBubble ? "[attached " + fileNameForBubble + "]" : "[image attached]"), image: imageForBubble, fileName: fileNameForBubble });
    queueSave();
    textarea.value = ""; pendingAttachments = []; sending = true; render();

    try{
      const sys = systemPrompt;
      const history = obj.chat.slice(0,-1).map(m=>({ role: m.role, content: m.content }));
      const reply = await callAssistant(sys, [...history, { role:"user", content: userMsgContent }]);
      obj.chat.push({ role:"assistant", content: reply });
    } catch(err){
      obj.chat.push({ role:"assistant", content: "⚠️ Couldn't reach the API: " + friendlyError(err) });
    }
    queueSave(); sending = false; render();
  }

      el("div",{class:"modal-actions"},
        el("button",{class:"modal-btn cancel", onclick:()=> closeEntityModal(backdrop)}, "Cancel"),
        el("button",{class:"modal-btn save", onclick:()=>{
          obj.name = name.trim();
          obj.color = color;
          queueSave();
          closeEntityModal(backdrop);
        }}, "Save")
      )
    );
    backdrop.appendChild(modal);
    return backdrop;
  }

  render();
})();
</script>
</body>
</html>
